name: Publicar Atualizacao OTA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'www/**'
      - '.github/workflows/ota-update.yml'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Empacotar atualizacao OTA
        env:
          RUN_NUM: ${{ github.run_number }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p ota-site
          (cd www && zip -r ../ota-site/bundle.zip .)
          node -e 'require("fs").writeFileSync("ota-site/version.json", JSON.stringify({ version: "1.0." + process.env.RUN_NUM, url: process.env.BASE_URL + "/bundle.zip" }))'

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ota-site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar indice do artefato no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for i in $(seq 1 15); do
            COUNT=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log((d.artifacts||[]).filter(a=>a.name==="github-pages").length);')
            echo "Tentativa $i: $COUNT artefato(s)"
            if [ "$COUNT" -ge 1 ]; then break; fi
            sleep 2
          done

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
