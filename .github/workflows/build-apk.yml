name: Compilar APK MK Truck

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar projeto Android com Capacitor
        run: |
          npm install
          npx cap add android
          node -e "const fs=require('fs'), p='android/app/src/main/AndroidManifest.xml'; let s=fs.readFileSync(p,'utf8'); s=s.replace('<application', '<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <application'); fs.writeFileSync(p,s);"
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: MK-Truck-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
